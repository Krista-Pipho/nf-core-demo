repository_type: pipeline

nf_core_version: 4.1.0

lint:
  files_unchanged:
    - .prettierignore
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/workflows/branch.yml
    - .github/workflows/pr-comment.yml
    - .github/workflows/linting.yml
    - .github/.dockstore.yml
    - CODE_OF_CONDUCT.md
    - assets/nf-core-varcall_logo_light.png
    - docs/images/nf-core-varcall_logo_light.png
    - docs/images/nf-core-varcall_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .prettierignore
    - docs/CONTRIBUTING.md
  nextflow_config: false
  nf_test_content: false
  # These per-platform container pinning files are generated by `nf-core modules install/update`
  # but aren't included anywhere in nextflow.config (every module already resolves its own
  # Singularity/Docker/conda container inline) - intentionally removed as unused duplication.
  container_configs: false
  multiqc_config:
    - report_comment
  files_exist:
    - assets/email_template.html
    - assets/sendmail_template.txt
    - assets/email_template.txt
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - conf/test_full.config
    - .github/workflows/nf-test.yml
    - .github/actions/get-shards/action.yml
    - .github/actions/nf-test/action.yml
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/ISSUE_TEMPLATE/feature_request.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/.dockstore.yml
    - docs/CONTRIBUTING.md
    - CODE_OF_CONDUCT.md
    - assets/nf-core-varcall_logo_light.png
    - docs/images/nf-core-varcall_logo_light.png
    - docs/images/nf-core-varcall_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - .github/workflows/nf-test.yml
    - .github/actions/get-shards/action.yml
    - .github/actions/nf-test/action.yml
    - nf-test.config
    - tests/default.nf.test
    - .github/workflows/branch.yml
    - .github/workflows/nf-test.yml
    - .github/actions/get-shards/action.yml
    - .github/actions/nf-test/action.yml
    - .github/workflows/pr-comment.yml
    - .github/workflows/linting.yml
  readme:
    - nextflow_badge
    - nextflow_badge
    - nfcore_template_badge

template:
  org: kpipho
  name: varcall
  description: Align paired-end Illumina reads to a reference genome and call germline
    short variants with GATK
  author: Krista Pipho
  version: 1.0.0dev
  force: true
  outdir: /home/krista/nf-core-demo
  skip_features:
    - github
    - github_badges
    - codespaces
    - vscode
    - ci
    - test_config
    - nf-test
    - rocrate
    - seqera_platform
    - email
    - igenomes
    - gpu
  is_nfcore: false
